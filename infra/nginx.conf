events {}

http {
  upstream astra_api { server api:8000; }
  upstream astra_web { server web:3000; }

  server {
    listen 80;
    client_max_body_size 2m;

    location /api/ {
      proxy_pass http://astra_api/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
    }

    location / {
      proxy_pass http://astra_web;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
