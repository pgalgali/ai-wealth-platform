openapi: 3.1.0
info:
  title: Astra Wealth API
  version: 0.1.0
  description: Mock-safe, provider-neutral APIs for Indian wealth intelligence.
servers:
  - url: http://localhost:8000
paths:
  /health/live:
    get:
      operationId: live
      responses:
        '200': { description: Service is alive }
  /health/ready:
    get:
      operationId: ready
      responses:
        '200': { description: Service is ready }
  /v1/market/overview:
    get:
      operationId: marketOverview
      responses:
        '200':
          description: Market pulse and breadth
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketOverviewResponse' }
  /v1/whales/changes:
    get:
      operationId: whaleChanges
      responses:
        '200':
          description: Disclosed institutional changes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WhaleChange' }
  /v1/screener/scan:
    post:
      operationId: runScreener
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScreenerRequest' }
      responses:
        '200':
          description: Screener results
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScreenerResponse' }
  /v1/copilot/ask:
    post:
      operationId: askCopilot
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CopilotRequest' }
      responses:
        '200':
          description: Cited research answer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CopilotResponse' }
components:
  schemas:
    MarketPulse:
      type: object
      required: [name, value, change, tone]
      properties:
        name: { type: string }
        value: { type: string }
        change: { type: string }
        tone: { type: string, enum: [positive, negative, neutral, warning] }
    MarketOverviewResponse:
      type: object
      required: [as_of, source_mode, pulse, breadth, data_quality]
      properties:
        as_of: { type: string, format: date-time }
        source_mode: { type: string }
        pulse: { type: array, items: { $ref: '#/components/schemas/MarketPulse' } }
        breadth: { type: object, additionalProperties: { type: number } }
        data_quality: { type: number, minimum: 0, maximum: 1 }
    WhaleChange:
      type: object
      required: [name, category, action, holding, change, signal, date]
      properties:
        name: { type: string }
        category: { type: string }
        action: { type: string }
        holding: { type: string }
        change: { type: string }
        signal: { type: string, enum: [positive, negative, neutral, warning] }
        date: { type: string }
    ScreenerRequest:
      type: object
      properties:
        universe: { type: string, default: nifty_500 }
        filters: { type: array, items: { type: string } }
        limit: { type: integer, minimum: 1, maximum: 100, default: 25 }
    ScreenerResult:
      type: object
      required: [ticker, company, sector, composite, quality, momentum, valuation]
      properties:
        ticker: { type: string }
        company: { type: string }
        sector: { type: string }
        composite: { type: integer, minimum: 0, maximum: 100 }
        quality: { type: integer, minimum: 0, maximum: 100 }
        momentum: { type: integer, minimum: 0, maximum: 100 }
        valuation: { type: string }
    ScreenerResponse:
      type: object
      required: [query, source_mode, results]
      properties:
        query: { $ref: '#/components/schemas/ScreenerRequest' }
        source_mode: { type: string }
        results: { type: array, items: { $ref: '#/components/schemas/ScreenerResult' } }
    CopilotRequest:
      type: object
      required: [question]
      properties:
        question: { type: string, minLength: 3, maxLength: 2000 }
        portfolio_context: { type: boolean, default: true }
    CopilotResponse:
      type: object
      required: [answer, confidence, risk_flags, citations, disclaimer]
      properties:
        answer: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }
        risk_flags: { type: array, items: { type: string } }
        citations: { type: array, items: { type: object } }
        disclaimer: { type: string }
